name: Motion
on:
  push:
    paths: [".github/workflows/motion.yml", "motion/*.py"]
  workflow_dispatch:
    inputs:
      script:
        description: "Сценарий (файл в motion/), например asr2"
        default: "asr2"
      reader:
        description: "Чтец: ar.husary, ar.muhammadayyoub, ar.abdulsamad"
        default: "ar.husary"
permissions:
  contents: write
jobs:
  motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0
      - run: pip install -q pillow fonttools numpy brotli
      - run: mkdir -p videos/motion && cd motion && python ${{ inputs.script || 'asr2' }}.py ../videos/motion/${{ inputs.script || 'asr2' }}_${{ inputs.reader || 'ar.husary' }}.mp4 ${{ inputs.reader || 'ar.husary' }}
      - run: |
          git config user.name "ummati-bot"; git config user.email "bot@users.noreply.github.com"
          git add videos/motion/*.mp4 videos/motion/*.json
          git commit -m "motion: ${{ inputs.script || 'asr2' }} ${{ inputs.reader || 'ar.husary' }}" && git pull --rebase --autostash && git push
