name: Shop photos
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза с фото, например shop-1"
        required: true
permissions:
  contents: write
jobs:
  ingest:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'shop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow pillow-heif
      - run: |
          mkdir -p _in && gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D _in
          ls -la _in
          python shop/ingest.py _in
          ls shop/photos | head -50
      - run: |
          git config user.name "ummati-bot"
          git config user.email "bot@users.noreply.github.com"
          git add shop
          git diff --cached --quiet && exit 0
          git commit -m "shop photos $TAG"
          ok=0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q origin main && git push origin HEAD:main && ok=1 && break; sleep 10; done
          [ $ok = 1 ]
