name: Uagyz
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "cut — нарезать по clips.json, post — опубликовать следующий, yt — следующий на YouTube, tt — в TikTok, post_yt — оба, check — проверить ключ"
        default: "post"
      tag:
        description: "Тег релиза для нарезки, например uagyz-1"
        default: ""
permissions:
  contents: write
concurrency: uagyz
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODE: ${{ inputs.mode || 'post' }}
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UAGYZ_IG_TOKEN: ${{ secrets.UAGYZ_IG_TOKEN }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
      TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
      TT_AUDITED: ${{ vars.TT_AUDITED }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: env.MODE == 'cut'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q pillow
          python -c "import render; render.ensure_fonts()"
          mkdir -p _in && gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D _in
          f=$(ls -S _in/* | head -1)
          python uagyz/cut.py "$f" "uagyz/$TAG/clips.json" "uagyz/$TAG/clips"
          rm -f "uagyz/$TAG/clips/overlay.png"
      - if: startsWith(env.MODE, 'post')
        run: python uagyz/post.py
      - if: ${{ !cancelled() && (env.MODE == 'post_yt' || env.MODE == 'yt') }}
        run: python uagyz/post.py yt
      - if: env.MODE == 'tt'
        run: python uagyz/post.py tt
      - if: env.MODE == 'check'
        run: CHECK_ONLY=1 python uagyz/post.py
      - if: ${{ !cancelled() && env.MODE != 'check' }}
        run: |
          git config user.name "ummati-bot"
          git config user.email "bot@users.noreply.github.com"
          git add uagyz
          git diff --cached --quiet && exit 0
          git commit -m "uagyz $MODE $TAG"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push && break; sleep 5; done
