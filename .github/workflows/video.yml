name: Video
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Сура или аяты, например 112, 2:255, 103:1-3 (auto — по плану)"
        default: "112"
      photo:
        description: "Фото для фона"
        default: "green_tex.jpg"
      youtube:
        description: "Загрузить на YouTube"
        type: boolean
        default: false
      reels:
        description: "Опубликовать в Instagram как Reels"
        type: boolean
        default: false
      tiktok:
        description: "Отправить в TikTok"
        type: boolean
        default: false
      threads:
        description: "Опубликовать видео в Threads"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    env:
      OUT: videos/${{ inputs.spec }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0
      - run: pip install -q pillow fonttools numpy
      - run: mkdir -p videos && python video.py "${{ inputs.spec }}" "${{ inputs.photo }}" "$(echo $OUT | tr ':' '_').mp4"
      - if: ${{ inputs.youtube }}
        id: yt
        run: python yt.py "$(echo $OUT | tr ':' '_').mp4"
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - if: ${{ !cancelled() && (inputs.tiktok || inputs.youtube) }}
        id: tt
        continue-on-error: true
        run: python tiktok.py "$(echo $OUT | tr ':' '_').mp4"
        env:
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_AUDITED: ${{ vars.TT_AUDITED }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ !cancelled() && inputs.reels }}
        id: ig
        run: python reel.py "$(echo $OUT | tr ':' '_').mp4"
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ !cancelled() && inputs.threads }}
        id: thr
        continue-on-error: true
        run: python threads_video.py "$(echo $OUT | tr ':' '_').mp4"
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ !cancelled() && (steps.yt.outcome == 'success' || steps.tt.outcome == 'success' || steps.ig.outcome == 'success' || steps.thr.outcome == 'success') && (startsWith(inputs.spec, 'auto') || startsWith(inputs.spec, 'card') || startsWith(inputs.spec, 'hadith') || startsWith(inputs.spec, 'support') || startsWith(inputs.spec, 'sale')) }}
        run: |
          git config user.name "ummati-bot"
          git config user.email "bot@users.noreply.github.com"
          git add yt_state.json $(ls card_state.json hadith_state.json support_state.json sale_state.json specials_state.json 2>/dev/null)
          git commit -m "yt_state"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push && break; sleep 5; done
      - if: ${{ !startsWith(inputs.spec, 'auto') && !startsWith(inputs.spec, 'voice') && !startsWith(inputs.spec, 'card') && !startsWith(inputs.spec, 'hadith') && !startsWith(inputs.spec, 'support') && !startsWith(inputs.spec, 'sale') }}
        run: |
          git config user.name "ummati-bot"
          git config user.email "bot@users.noreply.github.com"
          git add videos
          git commit -m "video ${{ inputs.spec }}"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push && break; sleep 5; done
