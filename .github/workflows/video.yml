name: Video
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Сура или аяты, например 112, 2:255, 103:1-3"
        default: "112"
      photo:
        description: "Фото для фона"
        default: "green_tex.jpg"
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0
      - run: pip install -q pillow
      - run: mkdir -p videos && python video.py "${{ inputs.spec }}" "${{ inputs.photo }}" "videos/$(echo '${{ inputs.spec }}' | tr ':' '_').mp4"
      - run: |
          git config user.name "ummati-bot"
          git config user.email "bot@users.noreply.github.com"
          git add videos
          git commit -m "video ${{ inputs.spec }}"
          git pull --rebase -q
          git push
